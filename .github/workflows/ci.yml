name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate repository baseline
        run: |
          test -f README.md
          test -d docs
          test -d api
          test -d database
          test -d workflows
          test -d tests

      - name: Validate JSON syntax
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          files = sorted(
              list(Path("workflows").glob("*/schema.json")) +
              list(Path("workflows").glob("*/examples/*.json"))
          )
          if not files:
              raise SystemExit("No workflow JSON files found")
          for path in files:
              json.loads(path.read_text(encoding="utf-8"))
              print(f"OK {path}")
          PY

      - name: Install schema validator
        run: python -m pip install --disable-pip-version-check --require-hashes -r requirements-ci.txt

      - name: Validate contract structure
        run: python scripts/validate_contracts.py

      - name: Validate positive and negative fixtures against JSON Schema and declared formats
        run: python scripts/validate_schema_fixtures.py

      - name: Test contract validator regressions
        run: python -m unittest discover -s tests -p 'test_*.py'

  wf-03-orchestration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: wf03_test
          POSTGRES_USER: wf03
          POSTGRES_PASSWORD: wf03-test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wf03 -d wf03_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://wf03:wf03-test-only-password@localhost:5432/wf03_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/wf-03-orchestration/package-lock.json

      - name: Install WF-03 dependencies
        working-directory: api/wf-03-orchestration
        run: npm ci

      - name: Install WF-01 and WF-02 dependencies for cross-workflow tests
        run: |
          npm ci --prefix api/wf-01-intake
          npm ci --prefix api/wf-02-planning

      - name: Typecheck WF-03
        working-directory: api/wf-03-orchestration
        run: npm run typecheck

      - name: Apply WF-03 PostgreSQL migration
        working-directory: api/wf-03-orchestration
        run: npm run migrate

      - name: Test WF-03 service and PostgreSQL persistence
        working-directory: api/wf-03-orchestration
        run: npm test

  wf-01-intake:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: wf01_test
          POSTGRES_USER: wf01
          POSTGRES_PASSWORD: wf01-test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wf01 -d wf01_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://wf01:wf01-test-only-password@localhost:5432/wf01_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/wf-01-intake/package-lock.json

      - name: Install WF-01 dependencies
        working-directory: api/wf-01-intake
        run: npm ci

      - name: Typecheck WF-01
        working-directory: api/wf-01-intake
        run: npm run typecheck

      - name: Apply WF-01 PostgreSQL migration
        working-directory: api/wf-01-intake
        run: npm run migrate

      - name: Test WF-01 service and PostgreSQL persistence
        working-directory: api/wf-01-intake
        run: npm test

  wf-02-planning:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: wf02_test
          POSTGRES_USER: wf02
          POSTGRES_PASSWORD: wf02-test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wf02 -d wf02_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://wf02:wf02-test-only-password@localhost:5432/wf02_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/wf-02-planning/package-lock.json

      - name: Install WF-02 dependencies
        working-directory: api/wf-02-planning
        run: npm ci

      - name: Typecheck WF-02
        working-directory: api/wf-02-planning
        run: npm run typecheck

      - name: Apply WF-02 PostgreSQL migration
        working-directory: api/wf-02-planning
        run: npm run migrate

      - name: Test WF-02 service and PostgreSQL persistence
        working-directory: api/wf-02-planning
        run: npm test
