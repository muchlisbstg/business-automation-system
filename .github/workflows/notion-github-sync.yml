name: Notion GitHub Sync

on:
  # Tests run against the PR branch without Notion secrets.
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft, closed]
  # Safe privileged events: the workflow checks out the default branch, never PR code.
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft, closed]
  issues:
    types: [opened, edited, reopened, closed]
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  issues: read

concurrency:
  group: notion-github-sync-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.issue.number || github.event.workflow_run.id || github.run_id }}
  cancel-in-progress: false

jobs:
  test:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout proposed code without credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Test sync mapper and API behavior
        run: node --test tests/notion-github-sync.test.mjs

  sync:
    if: github.event_name == 'pull_request_target' || github.event_name == 'issues' || github.event_name == 'workflow_run'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # pull_request_target and workflow_run are privileged events: always use default-branch code.
      - name: Checkout trusted default branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Upsert event in Notion
        if: env.NOTION_API_KEY != '' && env.NOTION_DATABASE_ID != ''
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DATABASE_ID: ${{ vars.NOTION_DATABASE_ID }}
        run: node scripts/notion-github-sync.mjs
      - name: Explain skipped live sync
        if: env.NOTION_API_KEY == '' || env.NOTION_DATABASE_ID == ''
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DATABASE_ID: ${{ vars.NOTION_DATABASE_ID }}
        run: |
          echo "::notice::Notion sync was skipped because NOTION_API_KEY and/or NOTION_DATABASE_ID is not configured."
          echo "No live Notion synchronization was verified."
